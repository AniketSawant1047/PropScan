spring:
  application:
    name: propscan-backend

  datasource:
    url: jdbc:h2:mem:propscandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: NON_NULL

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    com.propscan: DEBUG
    org.springframework.security: WARN

propscan:
  jwt:
    secret: propscan-jwt-secret-key-for-hackathon-2024-very-long-secret
    expiration: 86400000
  ai:
    provider: rule-based   # options: rule-based, openai, gemini
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4o-mini
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-1.5-flash
  location:
    provider: mock   # options: mock, google-maps
    google-maps:
      api-key: ${GOOGLE_MAPS_API_KEY:}
  mock-data:
    path: classpath:mock-data/

management:
  endpoints:
    web:
      exposure:
        include: health,info
