<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROPScan — Scan properties. Compare deals. Decide smarter.</title>
    <meta name="description" content="PROPScan is an AI-powered real estate metasearch platform. Search once, compare property listings from 99acres, MagicBricks, Housing, NoBroker and more. Find the best price and AI-powered property recommendations." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (registration) => console.log('ServiceWorker registration successful'),
            (err) => console.log('ServiceWorker registration failed: ', err)
          );
        });
      }
    </script>
  </body>
</html>
